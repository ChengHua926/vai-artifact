name: aa_accountability
version: "0.2.0"
description: "Records final Hermes tool invocations and native authorization decisions using the pinned observation patch. Checks invocation authorization and lexical file scope; checkpoints at turn boundaries."
author: agent-accountability prototype
hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_approval_request
  - post_approval_response
  - approval_policy_applied
