[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-sdk"
version = "0.0.1"
description = "Provider-side accountability SDK: the mediation chokepoint + trace lifecycle + protocol client."
requires-python = ">=3.11"
# the shared standard; declared so `pip install aa-sdk` pulls it (one install for the provider).
dependencies = ["aa-commons"]

[tool.hatch.build.targets.wheel]
packages = ["aa_sdk"]
