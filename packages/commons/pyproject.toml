[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-commons"
version = "0.0.1"
description = "Shared spine (trace schema, predicate interface, identifiers) for the agent-accountability prototype."
requires-python = ">=3.11"
dependencies = ["pycryptodome>=3.20"]

[tool.hatch.build.targets.wheel]
packages = ["aa_commons"]
