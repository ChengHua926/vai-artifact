<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>The lifecycle of a promise — openclaw integration</title>
<desc>The provider is split into two processes: openclaw (TypeScript, agent plus plugin) sends each tool call over localhost to the AA helper (Python, the SDK running guard and hashing). The helper sends traces and params to the offchain store and the bond plus three hashes to the onchain escrow, and is slashed on a verdict. The verifier fetches from the store, recomputes hashes and runs the predicate; a user or hunter challenges a session-promise pair.</desc>
<rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1c1c">The lifecycle of a promise — openclaw integration</text>

<rect x="22" y="70" width="176" height="192" rx="12" fill="none" stroke="#c2c2c8" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="110" y="87" text-anchor="middle" font-size="10.5" fill="#6a6a72">provider · honest-but-curious</text>

<rect x="38" y="98" width="144" height="56" rx="8" fill="#dce9fb" stroke="#3f7fc4"/>
<text x="110" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#1b3a5b">openclaw (TS)</text>
<text x="110" y="142" text-anchor="middle" font-size="11" fill="#45688a">agent + plugin</text>

<rect x="38" y="196" width="144" height="56" rx="8" fill="#d2efea" stroke="#2e9c92"/>
<text x="110" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#14463f">AA helper (Python)</text>
<text x="110" y="240" text-anchor="middle" font-size="11" fill="#3c6e66">SDK · guard · hashing</text>

<line x1="110" y1="154" x2="110" y2="194" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="116" y="179" font-size="9.5" fill="#6a6a72">tool, args, result</text>

<rect x="268" y="72" width="168" height="56" rx="8" fill="#d8f0e2" stroke="#36a172"/>
<text x="352" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#14492f">Store (offchain)</text>
<text x="352" y="116" text-anchor="middle" font-size="11" fill="#3c6e55">session traces + params</text>

<rect x="268" y="188" width="168" height="60" rx="8" fill="#fbe6cd" stroke="#dd9430"/>
<text x="352" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#5a3a0e">Escrow (onchain)</text>
<text x="352" y="233" text-anchor="middle" font-size="11" fill="#7a5a2a">bond + commitments; slash / pay</text>

<rect x="498" y="120" width="160" height="58" rx="8" fill="#f7dace" stroke="#d2683e"/>
<text x="578" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#5a2616">Verifier</text>
<text x="578" y="164" text-anchor="middle" font-size="11" fill="#7a4636">recompute hashes, run predicate</text>

<rect x="498" y="268" width="160" height="56" rx="8" fill="#e7e8ec" stroke="#9aa0aa"/>
<text x="578" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2f36">User / hunter</text>
<text x="578" y="312" text-anchor="middle" font-size="11" fill="#555b63">challenges (session, promise)</text>

<line x1="184" y1="202" x2="300" y2="129" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240" y="150" text-anchor="middle" font-size="9.5" fill="#6a6a72">trace + params</text>

<line x1="184" y1="222" x2="266" y2="213" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="226" y="205" text-anchor="middle" font-size="9.5" fill="#6a6a72">bond + 3 hashes</text>

<line x1="266" y1="236" x2="186" y2="244" stroke="#c8482f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="226" y="257" text-anchor="middle" font-size="9.5" fill="#c8482f">slash</text>

<line x1="500" y1="126" x2="438" y2="107" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="468" y="115" text-anchor="middle" font-size="9" fill="#6a6a72">fetch trace</text>

<line x1="437" y1="204" x2="510" y2="177" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="190" text-anchor="middle" font-size="9.5" fill="#6a6a72">event</text>

<line x1="520" y1="178" x2="440" y2="220" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="482" y="212" text-anchor="middle" font-size="9.5" fill="#6a6a72">verdict</text>

<line x1="498" y1="286" x2="424" y2="248" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="432" y="300" text-anchor="middle" font-size="9.5" fill="#6a6a72">challenge + bond</text>
</svg>
