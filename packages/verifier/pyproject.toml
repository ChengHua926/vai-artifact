[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-verifier"
version = "0.0.1"
description = "Neutral verifier: binding checks (I1) + the aa_commons predicate (I3) + on-chain verdict."
requires-python = ">=3.11"
dependencies = ["aa-commons", "web3>=6.0", "safe-pysha3==1.0.5"]

[tool.hatch.build.targets.wheel]
packages = ["aa_verifier"]
